# SNN-DIVERGENCE-HARNESS — repository identity and validation foundation

site_name: SNN Divergence Harness
site_description: Architecture and repository foundation for planned source-bound comparison and replay
strict: true
site_dir: .tool-cache/site
hooks:
  - tools/documentation_hooks.py
exclude_docs: |
  /internal/
theme:
  name: material
  logo: assets/anulum_logo.png
  favicon: assets/anulum_logo.png
nav:
  - Overview: index.md
  - Architecture: ARCHITECTURE.md
  - Validation tooling: validation-tooling.md
  - Data and authority boundaries: THREAT_MODEL.md
  - Repository boundary: adr/0001-repository-boundary.md
  - Contributing: CONTRIBUTING.md
  - Code of conduct: CODE_OF_CONDUCT.md
  - Governance: GOVERNANCE.md
  - Contributors: CONTRIBUTORS.md
  - Support: SUPPORT.md
  - Security reporting: SECURITY.md
  - Validation: VALIDATION.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [tools]
          options:
            allow_inspection: false
            docstring_style: numpy
            show_source: false
            show_signature_annotations: true
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
